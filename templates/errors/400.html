{% extends 'base.html' %}

{% block title %}400 Bad Request — TrustVault{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-8 text-center">
        <div class="display-1 text-warning fw-bold mb-3">
            <i class="bi bi-exclamation-octagon"></i> 400
        </div>
        <h2 class="fw-bold mb-3">Bad Request</h2>
        <p class="lead text-muted mb-4">
            The server could not understand the request due to malformed syntax, invalid parameters, or corrupted data.
        </p>
        <a href="{% url 'core:home' %}" class="btn btn-primary px-4">
            <i class="bi bi-house-door me-1"></i> Return to Safety
        </a>
    </div>
</div>
{% endblock %}
