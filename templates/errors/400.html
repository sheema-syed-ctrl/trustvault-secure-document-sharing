{% extends 'base.html' %}

{% block title %}400 Bad Request — TrustVault{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-12 col-md-8 col-lg-6 text-center">
        <div class="tv-card p-4 p-md-5">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 72px; height: 72px; background: rgba(245, 158, 11, 0.1); color: var(--tv-warning);">
                <i class="bi bi-exclamation-octagon fs-1"></i>
            </div>
            <div class="mb-2">
                <span class="tv-badge tv-badge-warning">HTTP 400</span>
            </div>
            <h1 class="h3 fw-bold mb-3">Bad Request</h1>
            <p class="text-muted mb-4">
                The server could not understand the request due to malformed parameters, unexpected payload format, or corrupted input data.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{% url 'core:home' %}" class="btn btn-primary px-4">
                    <i class="bi bi-house-door me-1"></i> Return to Safety
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
