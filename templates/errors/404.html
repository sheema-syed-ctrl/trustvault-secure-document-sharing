{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center py-5">

        <div class="display-1 text-secondary fw-bold mb-3">
            <i class="bi bi-search"></i> 404
        </div>
        <h2 class="fw-bold mb-3">Resource Not Found</h2>

        </a>
    </div>
</div>
{% endblock %}
