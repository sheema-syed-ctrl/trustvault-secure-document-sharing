<!-- TrustVault Sidebar Component -->
<aside class="tv-sidebar" id="tvSidebar" aria-label="Main Navigation">
    <div class="tv-sidebar-brand">
        <a href="{% url 'dashboard:index' %}" class="tv-brand-link">
            <div class="tv-brand-icon">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <span>Trust<span class="tv-brand-accent">Vault</span></span>
        </a>
    </div>

    <nav class="tv-sidebar-nav">
        <div class="tv-nav-section-title">Workspace</div>

        <!-- Dashboard Link (Role-Adaptive) -->
        <a href="{% url 'dashboard:index' %}" class="tv-nav-item {% if request.resolver_match.app_name == 'dashboard' %}active{% endif %}" title="Dashboard Overview">
            <i class="bi bi-grid-1x2-fill"></i>
            <span>Dashboard</span>
        </a>

        <!-- Document Repository Link -->
        <a href="{% url 'documents:list' %}" class="tv-nav-item {% if request.resolver_match.app_name == 'documents' and request.resolver_match.url_name != 'upload' %}active{% endif %}" title="Document Repository">
            <i class="bi bi-folder2-open"></i>
            <span>Documents</span>
        </a>

        <!-- Document Owner Actions -->
        {% if user.is_owner_role %}
            <div class="tv-nav-section-title">Operations</div>
            <a href="{% url 'documents:upload' %}" class="tv-nav-item {% if request.resolver_match.url_name == 'upload' %}active{% endif %}" title="Upload New Confidential Document">
                <i class="bi bi-cloud-arrow-up-fill"></i>
                <span>Upload Document</span>
            </a>
        {% endif %}

        <!-- Platform Administrator Governance -->
        {% if user.is_admin_role %}
            <div class="tv-nav-section-title">Security &amp; Governance</div>
            <a href="{% url 'audit:trail' %}" class="tv-nav-item {% if request.resolver_match.app_name == 'audit' %}active{% endif %}" title="Audit Trail &amp; Activity Monitor">
                <i class="bi bi-journal-text"></i>
                <span>Audit Trail</span>
            </a>
            <a href="{% url 'accounts:user_list' %}" class="tv-nav-item {% if request.resolver_match.app_name == 'accounts' and 'user' in request.resolver_match.url_name %}active{% endif %}" title="User Directory &amp; RBAC Control">
                <i class="bi bi-people-fill"></i>
                <span>User Directory</span>
            </a>
        {% endif %}
    </nav>

    <!-- Sidebar Bottom / Security Compliance Badge -->
    <div class="tv-sidebar-footer">
        <div class="tv-sidebar-security-badge">
            <div class="d-flex align-items-center gap-2 mb-1">
                <span class="tv-status-dot tv-status-dot-active"></span>
                <span class="small fw-semibold" style="color: var(--tv-text-main); font-size: 11px;">Zero-Knowledge Isolation</span>
            </div>
            <div class="text-muted" style="font-size: 10px;">SHA-256 Audit Integrity</div>
        </div>
    </div>
</aside>
<div class="tv-sidebar-backdrop" id="tvSidebarBackdrop" aria-hidden="true"></div>
